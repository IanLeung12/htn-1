<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Reality Editor</title>
    <meta name="description" content="Live mixed-reality room editor for the Meta Quest 3 browser (WebXR immersive-ar)." />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #app { position: fixed; inset: 0; }
    </style>
  </head>
  <body>
    <noscript>
      Reality Editor requires JavaScript and a WebXR-capable browser (Meta Quest browser, in
      immersive-ar mode). Please enable JavaScript to continue.
    </noscript>
    <div id="app"></div>
    <script type="module">
      import { startApp } from '/src/app/entry.ts';
      startApp({ container: document.getElementById('app'), persistKey: 'reality-editor' });
    </script>
  </body>
</html>
